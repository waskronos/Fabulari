<div>
    <h1>Login</h1>
    <label for="username">Username:</label>
    <input
        type="text"
        id="username"
        name="username"
        [(ngModel)]="username"
    />
    <label for="password">Password:</label>
    <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
    />
    <button (click)="login()">Login</button>

</div>
