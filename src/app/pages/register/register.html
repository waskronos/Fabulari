<div>
    <h1>Register
    </h1>

    <label for="username">Username:</label>
    <input
        type="text"
        id="username"
        name="username"
        [(ngModel)]="username"
    />
    <label for= "firstName">First Name:</label>
    <input
        type="text"
        id="firstName"
        name="firstName"
        [(ngModel)]="firstName"
    />
    <label for= "lastName">Last Name:</label>
    <input
        type="text"
        id="lastName"
        name="lastName"
        [(ngModel)]="lastName"
    />
    <label for= "email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
    />
    <label for= "age">Age:</label>
    <input
        type="number"
        id="age"
        name="age"
        [(ngModel)]="age"
    />
    <label for= "password">Password:</label>
    <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
    />

    <button (click)="register()">Register</button>

    <p>You entered {{ username }} and first name: {{ firstName }} and last name: {{ lastName }} and email: {{ email }} and age: {{ age }}</p>
</div>
