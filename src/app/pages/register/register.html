<div>
    <h1>Register
    </h1>

    @if (feedbackMessage()) {
        <div class="alert" [class.alert-error]="feedbackType() === 'error'" role="alert">
            {{ feedbackMessage() }}
        </div>
    }

    <label for="username">Username:</label>
    <input
        type="text"
        id="username"
        name="username"
        [(ngModel)]="username"
    />
    <label for= "firstName">First Name:</label>
    <input
        type="text"
        id="firstName"
        name="firstName"
        [(ngModel)]="firstName"
    />
    <label for= "lastName">Last Name:</label>
    <input
        type="text"
        id="lastName"
        name="lastName"
        [(ngModel)]="lastName"
    />
    <label for= "email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        [(ngModel)]="email"
    />
    <label for="dateOfBirth">Date of Birth:</label>
    <input
        type="date"
        id="dateOfBirth"
        name="dateOfBirth"
        [(ngModel)]="dateOfBirth"
        required
    />
    <label for= "password">Password:</label>
    <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="password"
    />

    <button (click)="register()">Register</button>

</div>
